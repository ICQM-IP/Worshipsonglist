<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICQM 詩歌資料庫 · 主頁</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
    <style>
        :root { --navy: #243b53; --muted: #66717a; --gold: #9b7438; --line: #e3e3dc; --rounded: "Huninn", "Microsoft JhengHei", sans-serif; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #f7f5f0; color: var(--navy); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif; font-size: 18px; line-height: 1.7; }
        .page { max-width: 1280px; min-height: 100vh; margin: auto; padding: 0 40px 28px; display: flex; flex-direction: column; }
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 25px 0; border-bottom: 1px solid var(--line); }
        .brand { font-family: var(--rounded); font-size: 34px; letter-spacing: 2px; line-height: 1.3; }
        .brand span { color: var(--gold); margin-right: 10px; font-size: 29px; }
        .topbar p { font-size: 13px; letter-spacing: 2.5px; color: var(--muted); }
        main { flex: 1; }
        .intro { padding: 44px 0 32px; }
        .eyebrow { display: flex; align-items: center; gap: 12px; color: var(--gold); font-size: 14px; letter-spacing: 3px; margin-bottom: 16px; }
        .eyebrow::before { content: ""; width: 28px; height: 1px; background: var(--gold); }
        h1 { font-family: var(--rounded); font-size: clamp(42px, 4vw, 58px); font-weight: 400; line-height: 1.3; letter-spacing: 3px; margin-bottom: 17px; }
        .intro > p { color: var(--muted); font-size: 20px; }
        .section-label { font-size: 16px; font-weight: 500; color: var(--muted); margin-bottom: 16px; }
        .portals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px; }
        .portal { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; padding: 34px; border: 1px solid var(--line); border-radius: 18px; background: #fff; }
        .portal-junior { background: #f4f2e9; border-color: #e5e0cf; }
        .portal-middle { border-top: 4px solid var(--navy); padding-top: 31px; }
        .portal-icon { width: 54px; height: 54px; padding: 12px; background: #eaf0f2; color: #536e7b; border-radius: 15px; margin-bottom: 25px; }
        .portal-junior .portal-icon { background: #eae4d3; color: #977c44; }
        .level { font-size: 15px; color: var(--gold); letter-spacing: 1px; margin-bottom: 4px; }
        .portal h2 { font-family: var(--rounded); font-size: clamp(28px, 2.8vw, 38px); font-weight: 400; line-height: 1.35; margin-bottom: 15px; }
        .description { font-size: 18px; color: #606d75; max-width: 28em; margin-bottom: 28px; }
        .portal-bottom { margin-top: auto; width: 100%; padding-top: 22px; border-top: 1px solid #e3e6e0; }
        .coming { display: inline-block; padding: 11px 20px; border: 1px solid #dcd5c2; border-radius: 9px; background: #ece7d9; color: #776647; font-size: 17px; }
        .enter { display: flex; align-items: center; justify-content: space-between; gap: 20px; width: 100%; padding: 13px 20px; border-radius: 9px; background: var(--navy); color: #fff; text-decoration: none; font-size: 18px; transition: background .15s; }
        .enter:hover { background: #162b40; }
        .enter:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
        .enter span[aria-hidden] { font-size: 23px; line-height: 1; }
        footer { margin-top: 44px; padding-top: 22px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 15px; color: var(--muted); font-size: 14px; }
        @media (max-width: 760px) {
            .page { padding: 0 22px 24px; }
            .topbar { padding: 22px 0; }
            .topbar p { display: none; }
            .brand { font-size: 28px; }
            .brand span { font-size: 24px; }
            .intro { padding: 32px 0 26px; }
            h1 { font-size: 40px; letter-spacing: 2px; }
            .eyebrow { font-size: 12px; }
            .intro > p { font-size: 17px; }
            .portals { grid-template-columns: minmax(0, 1fr); gap: 18px; }
            .portal { padding: 26px; }
            .portal-middle { padding-top: 23px; }
            .portal-icon { margin-bottom: 19px; }
            .portal h2 { font-size: 29px; }
            .description, .enter { font-size: 17px; }
            footer { flex-direction: column; gap: 4px; font-size: 12px; margin-top: 30px; }
        }
        @media (prefers-reduced-motion: reduce) { .enter { transition: none; } }
    </style>
</head>
<body>
    <div class="page">
        <div class="topbar">
            <div class="brand"><span aria-hidden="true">♪</span> ICQM</div>
            <p>WORSHIP SONG LIBRARY</p>
        </div>
        <main>
            <header class="intro">
                <div class="eyebrow">詩歌 · 經文 · 禱告</div>
                <h1>詩歌資料庫</h1>
                <p>用心靈唱出禱告，讓真理走進生活。</p>
            </header>
            <section aria-label="Sections">
                <div class="portals">
                    <article class="portal portal-junior" aria-labelledby="junior-title">
                        <svg class="portal-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-9M12 15C5 15 3 10 3 4c6 0 9 3 9 8M12 12c0-5 3-8 9-8 0 6-2 11-9 11"/></svg>
                        <p class="level">G1–4</p>
                        <h2 id="junior-title">Junior</h2>
                        <p class="description">一起唱詩讚美，聽聽神的話，在禱告中親近愛我們的天父。</p>
                        <div class="portal-bottom"><a class="enter" href="junior.html" aria-label="進入 Junior 詩歌資料庫">進入詩歌資料庫 <span aria-hidden="true">→</span></a></div>
                    </article>
                    <article class="portal portal-middle" aria-labelledby="middle-title">
                        <svg class="portal-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5c-3-2-7-2-10-1v15c3-1 7-1 10 1 3-2 7-2 10-1V4c-3-1-7-1-10 1Zm0 0v15"/></svg>
                        <p class="level">G5–12</p>
                        <h2 id="middle-title">Middle &amp; Senior</h2>
                        <p class="description">按主題探索詩歌，閱讀經文與禱告，一起在敬拜中親近神。</p>
                        <div class="portal-bottom"><a class="enter" href="middle-senior.html" aria-label="進入 Middle &amp; Senior 詩歌資料庫">進入詩歌資料庫 <span aria-hidden="true">→</span></a></div>
                    </article>
                </div>
            </section>
        </main>
        <footer><span>ICQM · 詩歌資料庫</span></footer>
    </div>
</body>
</html>
